name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Poetry
        run: pip install poetry==1.8.3

      - name: Install dependencies
        run: poetry install --no-interaction

      - name: Run migrations
        env:
          DATABASE_URL: sqlite:///./test_ci.db
          SECRET_KEY: ci-test-secret-key-not-for-production
        run: poetry run alembic upgrade head

      - name: Run tests
        env:
          DATABASE_URL: sqlite:///./test_ci.db
          SECRET_KEY: ci-test-secret-key-not-for-production
        run: poetry run pytest --tb=short -q

  admin-build:
    name: Admin Dashboard Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/admin-dashboard

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/admin-dashboard/package-lock.json

      # npm ci(엄격 lock 동기화) 대신 npm install 사용:
      # admin-dashboard는 v1(모바일 로컬 우선)과 무관한 휴면 컴포넌트이고,
      # lightningcss/rolldown의 @emnapi/* 는 플랫폼별 optional dep이라
      # Windows에서 생성한 lock이 Linux CI의 npm ci를 통과 못 함(EUSAGE).
      # npm install 은 설치 시 플랫폼 의존성을 보완하므로 크로스플랫폼에 안전.
      - name: Install dependencies
        run: npm install --no-audit --fund=false

      - name: Type check & build
        run: npm run build

  flutter-analyze:
    name: Flutter Analyze
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/mobile

    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.x"
          channel: stable

      # leeeo_app_core·leeeo_ads는 비공개 저장소 leeeo/leeeo-app의 태그에서 받는다(pubspec.yaml).
      # GITHUB_TOKEN은 다른 비공개 저장소를 읽지 못하므로, leeeo-app 읽기 전용 토큰(저장소 시크릿
      # LEEEO_APP_READ_TOKEN)을 그 주소에만 끼워 넣는다(git url.insteadOf, 클론 설정에는 남지 않음).
      - name: Access private leeeo-app packages
        env:
          LEEEO_APP_READ_TOKEN: ${{ secrets.LEEEO_APP_READ_TOKEN }}
        run: |
          if [ -z "$LEEEO_APP_READ_TOKEN" ]; then
            echo "::error::LEEEO_APP_READ_TOKEN 시크릿이 없습니다. leeeo/leeeo-app 읽기 전용 토큰을 저장소 시크릿으로 넣어야 flutter pub get이 됩니다."
            exit 1
          fi
          git config --global url."https://x-access-token:${LEEEO_APP_READ_TOKEN}@github.com/leeeo/leeeo-app".insteadOf "https://github.com/leeeo/leeeo-app"

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test

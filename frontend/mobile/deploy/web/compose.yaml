# Static Flutter web build of the local-mode app, served behind Cloudflare Tunnel leeeo-vm.
name: sangsang-web
services:
  web:
    image: nginx:1.29-alpine
    restart: unless-stopped
    volumes:
      - ./html:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "127.0.0.1:8790:80"

# Static Flutter web build of the local-mode app, served behind Cloudflare Tunnel leeeo-vm.
name: sangsang-web
services:
  web:
    # Shared patched base (nginx 1.30 stable + apk upgrade), built 2026-11-07 from leeeo-company deploy/static/nginx-base.
    image: leeeo-nginx-base:20261107
    pull_policy: never
    restart: unless-stopped
    volumes:
      - ./html:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "127.0.0.1:8790:80"

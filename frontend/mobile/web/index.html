<!DOCTYPE html>
<html lang="ko">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="상부상조 - 경조사비 관리. 설치 없이 브라우저에서 쓰는 웹판(기록은 이 브라우저에만 저장).">
  <meta name="theme-color" content="#285C50">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="startup.css">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="상부상조">
  <link rel="apple-touch-icon" href="icons/Icon-192.png?v=1.1.1">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png?v=1.1.1"/>

  <title>상부상조 - 경조사비 관리</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <main id="startup" aria-labelledby="startup-title">
    <img src="icons/app.svg" width="48" height="48" alt="">
    <h1 id="startup-title">상부상조</h1>
    <p id="startup-status" role="status">마음 기록장을 준비하고 있어요.</p>
    <p>기록은 이 브라우저에만 보관돼요.</p>
    <button id="startup-retry" type="button" hidden>다시 열기</button>
    <noscript>기록장을 열려면 브라우저에서 JavaScript를 허용해 주세요.</noscript>
  </main>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
